<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Brain - universal operating harness for AI agents</title>
  <desc id="desc">Animated dark banner with moving agent runtime chips and an evidence-first workflow rail.</desc>
  <defs>
    <radialGradient id="g1" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="stroke" x1="80" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1280 0;1280 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.65"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .chip{fill:#0f172a;stroke:#334155;stroke-width:1.2}
      .chipText{fill:#dbeafe;font-size:20px;font-weight:700;letter-spacing:.2px}
      .small{fill:#94a3b8;font-size:18px}
      .step{fill:#020617;stroke:#334155;stroke-width:1.2}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1280" height="520" rx="34" fill="#020617"/>
  <rect width="1280" height="520" rx="34" fill="url(#g1)"/>
  <rect width="1280" height="520" rx="34" fill="url(#grid)" opacity="0.75"/>
  <rect x="18" y="18" width="1244" height="484" rx="28" stroke="url(#stroke)" stroke-width="2" opacity="0.9"/>
  <rect x="18" y="18" width="1244" height="484" rx="28" fill="url(#shine)" opacity="0.28"/>

  <circle cx="1060" cy="110" r="130" fill="#7c3aed" opacity="0.22" filter="url(#glow)"/>
  <circle cx="245" cy="395" r="160" fill="#06b6d4" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1180" cy="420" r="100" fill="#34d399" opacity="0.13" filter="url(#glow)"/>

  <g transform="translate(70 72)">
    <rect x="0" y="0" width="255" height="42" rx="21" fill="#0f172a" stroke="#22d3ee" opacity="0.96"/>
    <circle class="pulse" cx="24" cy="21" r="7" fill="#34d399"/>
    <text class="mono" x="43" y="28" fill="#bae6fd" font-size="18" font-weight="700">UNIVERSAL AGENT HARNESS</text>
  </g>

  <text class="sans" x="70" y="185" fill="#f8fafc" font-size="74" font-weight="900" letter-spacing="-3">Agent Brain</text>
  <text class="sans" x="70" y="245" fill="#dbeafe" font-size="32" font-weight="750" letter-spacing="-.7">The operating layer for every coding agent.</text>
  <text class="sans" x="70" y="292" fill="#94a3b8" font-size="24" font-weight="500">Evidence before code. Verification before trust. Learning before memory.</text>

  <g transform="translate(70 335)">
    <rect class="step" x="0" y="0" width="128" height="54" rx="14"/><text class="mono" x="23" y="35" fill="#e0f2fe" font-size="18" font-weight="800">INTAKE</text>
    <path d="M136 27H174" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M166 20L176 27L166 34" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="step" x="184" y="0" width="138" height="54" rx="14"/><text class="mono" x="211" y="35" fill="#ede9fe" font-size="18" font-weight="800">GRILL</text>
    <path d="M330 27H368" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M360 20L370 27L360 34" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="step" x="378" y="0" width="138" height="54" rx="14"/><text class="mono" x="408" y="35" fill="#dcfce7" font-size="18" font-weight="800">PLAN</text>
    <path d="M524 27H562" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M554 20L564 27L554 34" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="step" x="572" y="0" width="138" height="54" rx="14"/><text class="mono" x="604" y="35" fill="#fef3c7" font-size="18" font-weight="800">BUILD</text>
    <path d="M718 27H756" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M748 20L758 27L748 34" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="step" x="766" y="0" width="146" height="54" rx="14"/><text class="mono" x="795" y="35" fill="#fee2e2" font-size="18" font-weight="800">VERIFY</text>
  </g>

  <g transform="translate(70 430)">
    <text class="mono small" x="0" y="0">Works with agents that can read files and follow instructions:</text>
    <g transform="translate(0 22)">
      <animateTransform attributeName="transform" type="translate" values="0 22;-330 22;0 22" dur="18s" repeatCount="indefinite"/>
      <rect class="chip" x="0" y="0" width="116" height="42" rx="21"/><text class="mono chipText" x="22" y="28">Claude</text>
      <rect class="chip" x="128" y="0" width="116" height="42" rx="21"/><text class="mono chipText" x="155" y="28">Cursor</text>
      <rect class="chip" x="256" y="0" width="118" height="42" rx="21"/><text class="mono chipText" x="283" y="28">Copilot</text>
      <rect class="chip" x="386" y="0" width="118" height="42" rx="21"/><text class="mono chipText" x="418" y="28">GPT</text>
      <rect class="chip" x="516" y="0" width="118" height="42" rx="21"/><text class="mono chipText" x="543" y="28">Gemini</text>
      <rect class="chip" x="646" y="0" width="132" height="42" rx="21"/><text class="mono chipText" x="673" y="28">Windsurf</text>
      <rect class="chip" x="790" y="0" width="96" height="42" rx="21"/><text class="mono chipText" x="816" y="28">Aider</text>
      <rect class="chip" x="898" y="0" width="96" height="42" rx="21"/><text class="mono chipText" x="927" y="28">Cline</text>
      <rect class="chip" x="1006" y="0" width="118" height="42" rx="21"/><text class="mono chipText" x="1032" y="28">Replit</text>
      <rect class="chip" x="1136" y="0" width="130" height="42" rx="21"/><text class="mono chipText" x="1163" y="28">OpenCode</text>
    </g>
  </g>
</svg>
