<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Brain operating harness</title>
  <desc id="desc">Static banner showing Agent Brain routing a coding agent through commands, skills, artifacts, evidence, and handoff.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #111827; }
    .muted { fill: #4b5563; }
    .subtle { fill: #f8fafc; }
    .border { stroke: #d1d5db; stroke-width: 1.5; }
    .line { stroke: #111827; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    .blue { fill: #2563eb; }
    .green { fill: #059669; }
    .orange { fill: #f97316; }
    .label { font: 700 42px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .body { font: 500 19px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font: 650 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: .03em; }
    .mono { font: 650 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect class="bg" width="1200" height="360" rx="18"/>
  <rect x="24" y="24" width="1152" height="312" rx="14" class="subtle border"/>

  <g transform="translate(70 62)">
    <text x="0" y="26" class="small muted">AGENT BRAIN</text>
    <text x="0" y="78" class="label ink">Operating harness for coding agents</text>
    <text x="0" y="116" class="body muted">A repo-local state machine, command set, skill catalog, artifact contract,</text>
    <text x="0" y="146" class="body muted">and evidence gate for agents that need to be trusted after the chat ends.</text>

    <g transform="translate(0 196)">
      <rect x="0" y="0" width="154" height="52" rx="8" fill="#ffffff" class="border"/>
      <text x="22" y="32" class="mono ink">request</text>
      <path d="M168 26H220" class="line"/>
      <path d="M211 17L222 26L211 35" class="line"/>

      <rect x="238" y="0" width="154" height="52" rx="8" fill="#ffffff" class="border"/>
      <text x="260" y="32" class="mono ink">command</text>
      <path d="M406 26H458" class="line"/>
      <path d="M449 17L460 26L449 35" class="line"/>

      <rect x="476" y="0" width="154" height="52" rx="8" fill="#ffffff" class="border"/>
      <text x="514" y="32" class="mono ink">skill</text>
      <path d="M644 26H696" class="line"/>
      <path d="M687 17L698 26L687 35" class="line"/>

      <rect x="714" y="0" width="154" height="52" rx="8" fill="#ffffff" class="border"/>
      <text x="739" y="32" class="mono ink">artifact</text>
      <path d="M882 26H934" class="line"/>
      <path d="M925 17L936 26L925 35" class="line"/>

      <rect x="952" y="0" width="154" height="52" rx="8" fill="#111827"/>
      <text x="983" y="32" class="mono" fill="#ffffff">evidence</text>
    </g>
  </g>

  <g transform="translate(802 66)">
    <rect x="0" y="0" width="314" height="44" rx="8" fill="#111827"/>
    <text x="22" y="28" class="small" fill="#ffffff">WHAT THE HARNESS ENFORCES</text>

    <g transform="translate(0 72)">
      <circle cx="16" cy="16" r="8" class="blue"/>
      <text x="42" y="22" class="body ink">Choose the right lifecycle state</text>
    </g>
    <g transform="translate(0 118)">
      <circle cx="16" cy="16" r="8" class="green"/>
      <text x="42" y="22" class="body ink">Produce a schema-backed artifact</text>
    </g>
    <g transform="translate(0 164)">
      <circle cx="16" cy="16" r="8" class="orange"/>
      <text x="42" y="22" class="body ink">Verify before review or handoff</text>
    </g>
    <g transform="translate(0 224)">
      <rect x="0" y="0" width="314" height="54" rx="8" fill="#ffffff" class="border"/>
      <text x="20" y="33" class="mono ink">/brain-start -> /brain-verify</text>
    </g>
  </g>
</svg>
