<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Brain concept strip</title>
  <desc id="desc">Static monochrome comic strip showing a messy request becoming commands, skills, artifacts, evidence, and a review-ready handoff.</desc>
  <style>
    .paper { fill: #fff; }
    .ink { stroke: #111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: #111; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .wash { fill: #f4f4f4; }
    .black { fill: #111; }
    .white { fill: #fff; }
    .title { font: 800 23px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: .05em; fill: #111; }
    .label { font: 800 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #111; }
    .small { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #111; }
    .caption { font: 700 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111; }
    .dash { stroke-dasharray: 7 9; }
  </style>

  <rect class="paper" width="1200" height="340"/>
  <rect x="18" y="18" width="1164" height="304" class="thin"/>

  <g transform="translate(42 46)">
    <rect x="0" y="0" width="315" height="236" class="thin"/>
    <text x="24" y="36" class="title">1. VAGUE INPUT</text>
    <path d="M42 78C54 54 98 52 111 76C137 62 174 77 168 108C197 112 205 151 175 164C153 195 97 190 82 170C44 176 25 137 50 116C26 101 29 85 42 78Z" class="thin" fill="#fff"/>
    <text x="78" y="106" class="label">build this</text>
    <text x="86" y="132" class="label">fast?</text>
    <path d="M45 199C88 176 139 210 184 190C223 174 252 204 286 183" class="thin dash"/>
    <path d="M54 218C103 200 150 232 204 211C237 198 263 221 291 207" class="thin dash"/>
    <text x="46" y="220" class="caption">Guessing starts here.</text>
  </g>

  <g transform="translate(442 46)">
    <rect x="0" y="0" width="315" height="236" class="thin"/>
    <text x="24" y="36" class="title">2. HARNESS ROUTE</text>
    <circle cx="80" cy="110" r="38" class="thin" fill="#fff"/>
    <rect x="54" y="98" width="52" height="24" rx="6" class="black"/>
    <circle cx="69" cy="110" r="5" class="white"/>
    <circle cx="91" cy="110" r="5" class="white"/>
    <rect x="56" y="148" width="48" height="52" rx="14" class="thin" fill="#fff"/>
    <path d="M112 140L166 122" class="thin"/>
    <path d="M166 122L196 150" class="thin"/>
    <path d="M187 139L207 128" class="ink"/>
    <rect x="145" y="64" width="132" height="36" rx="5" class="thin" fill="#fff"/>
    <text x="162" y="88" class="small">/brain-start</text>
    <rect x="151" y="164" width="124" height="36" rx="5" class="thin" fill="#fff"/>
    <text x="171" y="188" class="small">skills/</text>
    <path d="M226 112L260 112" class="ink"/>
    <path d="M250 102L264 112L250 122" class="ink"/>
    <text x="44" y="220" class="caption">The route picks the state.</text>
  </g>

  <g transform="translate(842 46)">
    <rect x="0" y="0" width="315" height="236" class="thin"/>
    <text x="24" y="36" class="title">3. VERIFIED HANDOFF</text>
    <rect x="58" y="68" width="124" height="150" class="thin" fill="#fff"/>
    <path d="M78 102L91 115L114 87" class="ink"/>
    <path d="M78 137H158" class="thin"/>
    <path d="M78 164H158" class="thin"/>
    <path d="M78 190H142" class="thin"/>
    <rect x="196" y="88" width="82" height="110" rx="10" class="thin" fill="#fff"/>
    <circle cx="237" cy="138" r="24" class="thin" fill="#fff"/>
    <path d="M226 138L235 147L250 126" class="ink"/>
    <text x="80" y="220" class="caption">Review starts from proof.</text>
  </g>

  <path d="M374 164H424" class="ink"/>
  <path d="M414 154L428 164L414 174" class="ink"/>
  <path d="M774 164H824" class="ink"/>
  <path d="M814 154L828 164L814 174" class="ink"/>
</svg>
