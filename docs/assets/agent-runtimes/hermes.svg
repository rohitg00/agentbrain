<svg width="1113" height="196" viewBox="0 0 1113 196" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hermes-Agent logo</title>
  <desc id="desc">A black, yellow, and orange Hermes-Agent wordmark.</desc>
  <style>
    .word {
      font-family: "Arial Black", Impact, Haettenschweiler, sans-serif;
      font-size: 112px;
      font-weight: 900;
      letter-spacing: -4px;
    }
  </style>
  <rect width="1113" height="196" fill="#151515"/>
  <g transform="scale(.72 1)">
    <text x="28" y="121" class="word" fill="none" stroke="#d28a34" stroke-width="2" textLength="1460" lengthAdjust="spacingAndGlyphs">HERMES-AGENT</text>
    <text x="34" y="116" class="word" fill="none" stroke="#ffd21a" stroke-width="2" textLength="1460" lengthAdjust="spacingAndGlyphs">HERMES-AGENT</text>
    <text x="40" y="111" class="word" fill="none" stroke="#111" stroke-width="8" textLength="1460" lengthAdjust="spacingAndGlyphs">HERMES-AGENT</text>
    <text x="24" y="105" class="word" fill="#ffcc00" textLength="1460" lengthAdjust="spacingAndGlyphs">HERMES-AGENT</text>
  </g>
  <clipPath id="lower-band">
    <rect x="0" y="84" width="1113" height="70"/>
  </clipPath>
  <g transform="scale(.72 1)" clip-path="url(#lower-band)">
    <text x="24" y="105" class="word" fill="#d48633" textLength="1460" lengthAdjust="spacingAndGlyphs">HERMES-AGENT</text>
  </g>
</svg>
